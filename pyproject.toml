[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pylog"
version = "0.1.0"
description = "A Kafka-style durable, partitioned, replicated commit log with full Raft consensus. Pure Python stdlib."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rahul Raj Singh" }]
keywords = ["kafka", "commit-log", "raft", "distributed-systems"]

[project.scripts]
pylog = "cli:main"

[tool.setuptools]
packages = ["pylog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["UP007", "UP006", "UP035"]
